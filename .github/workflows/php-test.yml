name: PHP REST Client Testing

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Test Case 1: Checkout Repo
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Setup PHP
      # =========================
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl
          coverage: none

      # =========================
      # Test Case 2: API Key tersedia
      # =========================
      - name: Check API Key
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          php -r "if (!getenv('API_KEY')) { echo 'API_KEY NOT FOUND'; exit(1); } echo 'API_KEY OK';"

      # =========================
      # Test Case 3: File index.php ada
      # =========================
      - name: Check index.php exists
        run: test -f index.php

      # =========================
      # Test Case 4: File config/config.php ada
      # =========================
      - name: Check config file exists
        run: test -f config/config.php

      # =========================
      # Test Case 5: Fungsi http_request_get tersedia
      # =========================
      - name: Check http_request_get function
        run: |
          php -r "require 'config/config.php'; if (!function_exists('http_request_get')) { exit(1); }"

      # =========================
      # Test Case 6: Sintaks PHP valid
      # =========================
      - name: Check PHP syntax
        run: php -l index.php
