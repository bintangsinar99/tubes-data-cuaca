name: PHP REST Client Testing

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl
          coverage: none

      - name: Check API Key
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          php -r "if (!getenv('API_KEY')) { exit(1); } echo 'API_KEY OK';"

      - name: Check index.php syntax
        run: php -l index.php
